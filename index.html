<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Street Chase Runner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        canvas { display: block; }
        
        /* Loading Screen */
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #0a0a2e 0%, #1a1a4e 50%, #0a0a2e 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s;
        }
        #loading-screen.hidden { opacity: 0; pointer-events: none; }
        #loading-screen h1 {
            font-size: 3em; color: #ff6b35; text-shadow: 0 0 20px rgba(255,107,53,0.5);
            margin-bottom: 10px; letter-spacing: 3px;
        }
        #loading-screen p { color: #aaa; font-size: 1.1em; margin-bottom: 30px; }
        .loading-bar-container {
            width: 300px; height: 6px; background: rgba(255,255,255,0.1);
            border-radius: 3px; overflow: hidden;
        }
        .loading-bar {
            height: 100%; width: 0%; background: linear-gradient(90deg, #ff6b35, #ffd700);
            border-radius: 3px; transition: width 0.3s;
        }

        /* Main Menu */
        #main-menu {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(10,10,46,0.85) 0%, rgba(26,26,78,0.95) 100%);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 900;
        }
        #main-menu.active { display: flex; }
        #main-menu h1 {
            font-size: clamp(2em, 6vw, 4em); color: #ff6b35;
            text-shadow: 0 0 30px rgba(255,107,53,0.6), 0 4px 8px rgba(0,0,0,0.5);
            margin-bottom: 5px; letter-spacing: 4px; font-weight: 900;
        }
        #main-menu .subtitle {
            color: #ffd700; font-size: clamp(0.8em, 2vw, 1.2em);
            margin-bottom: 40px; letter-spacing: 6px; text-transform: uppercase;
        }
        .menu-btn {
            width: 260px; padding: 16px 0; margin: 8px 0; border: none;
            border-radius: 12px; font-size: 1.2em; font-weight: 700;
            cursor: pointer; transition: all 0.2s; letter-spacing: 1px;
            text-transform: uppercase;
        }
        .menu-btn.play {
            background: linear-gradient(135deg, #ff6b35, #ff8c42);
            color: #fff; box-shadow: 0 4px 20px rgba(255,107,53,0.4);
        }
        .menu-btn.play:hover { transform: scale(1.05); box-shadow: 0 6px 30px rgba(255,107,53,0.6); }
        .menu-btn.secondary {
            background: rgba(255,255,255,0.1); color: #ddd;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .menu-btn.secondary:hover { background: rgba(255,255,255,0.2); transform: scale(1.03); }
        .menu-stats {
            position: absolute; top: 20px; right: 20px;
            display: flex; gap: 20px;
        }
        .stat-item {
            display: flex; align-items: center; gap: 6px;
            color: #ffd700; font-size: 1.1em; font-weight: 700;
        }
        .stat-icon { font-size: 1.3em; }

        /* HUD */
        #hud {
            position: fixed; top: 0; left: 0; width: 100%;
            padding: 15px 20px; display: none; z-index: 800;
            pointer-events: none;
        }
        #hud.active { display: flex; justify-content: space-between; align-items: flex-start; }
        .hud-left, .hud-right { display: flex; flex-direction: column; gap: 8px; }
        .hud-item {
            display: flex; align-items: center; gap: 8px;
            color: #fff; font-size: 1.1em; font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .hud-item .icon { font-size: 1.3em; }
        .hud-item .value { min-width: 60px; }
        #score-display { font-size: 1.4em; color: #ffd700; }
        #distance-display { color: #aaa; font-size: 0.9em; }
        
        /* Power-up indicator */
        #powerup-indicator {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #fff; font-size: 2em; font-weight: 900; text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255,215,0,0.8); display: none; z-index: 850;
            animation: powerupPop 1s ease-out forwards;
            pointer-events: none;
        }
        @keyframes powerupPop {
            0% { transform: translate(-50%,-50%) scale(0.5); opacity: 0; }
            30% { transform: translate(-50%,-50%) scale(1.3); opacity: 1; }
            100% { transform: translate(-50%,-50%) scale(1); opacity: 0; }
        }
        
        /* Active power-up bar */
        #active-powerup {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            display: none; align-items: center; gap: 10px;
            background: rgba(0,0,0,0.7); padding: 8px 20px;
            border-radius: 20px; z-index: 800; pointer-events: none;
        }
        #active-powerup.active { display: flex; }
        #active-powerup .powerup-name { color: #ffd700; font-weight: 700; font-size: 0.9em; }
        #active-powerup .powerup-bar {
            width: 120px; height: 6px; background: rgba(255,255,255,0.2);
            border-radius: 3px; overflow: hidden;
        }
        #active-powerup .powerup-fill {
            height: 100%; background: linear-gradient(90deg, #ff6b35, #ffd700);
            border-radius: 3px; transition: width 0.1s;
        }

        /* Pause Menu */
        #pause-menu {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none;
            flex-direction: column; align-items: center; justify-content: center;
            z-index: 950;
        }
        #pause-menu.active { display: flex; }
        #pause-menu h2 { color: #ff6b35; font-size: 2.5em; margin-bottom: 30px; }

        /* Game Over Screen */
        #game-over {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none;
            flex-direction: column; align-items: center; justify-content: center;
            z-index: 950;
        }
        #game-over.active { display: flex; }
        #game-over h2 {
            color: #ff4444; font-size: 2.5em; margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255,68,68,0.5);
        }
        #game-over .final-score {
            color: #ffd700; font-size: 3em; font-weight: 900; margin-bottom: 5px;
        }
        #game-over .final-distance { color: #aaa; font-size: 1.1em; margin-bottom: 10px; }
        .reward-container {
            background: rgba(255,255,255,0.1); border-radius: 12px;
            padding: 15px 30px; margin-bottom: 20px; text-align: center;
        }
        .reward-container h3 { color: #ff6b35; margin-bottom: 8px; }
        .reward-items { display: flex; gap: 20px; justify-content: center; }
        .reward-item { color: #ffd700; font-size: 1.1em; }

        /* Shop / Characters */
        #shop-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(10,10,46,0.95) 0%, rgba(26,26,78,0.98) 100%);
            display: none; flex-direction: column; align-items: center;
            z-index: 900; overflow-y: auto; padding: 20px;
        }
        #shop-screen.active { display: flex; }
        #shop-screen h2 { color: #ff6b35; font-size: 2em; margin: 20px 0; }
        .char-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px; width: 100%; max-width: 600px; padding: 0 10px;
        }
        .char-card {
            background: rgba(255,255,255,0.08); border-radius: 12px;
            padding: 15px; text-align: center; cursor: pointer;
            border: 2px solid transparent; transition: all 0.2s;
        }
        .char-card:hover { border-color: rgba(255,107,53,0.5); }
        .char-card.selected { border-color: #ff6b35; background: rgba(255,107,53,0.15); }
        .char-card.locked { opacity: 0.6; }
        .char-card .char-avatar {
            width: 60px; height: 60px; margin: 0 auto 10px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 2em;
        }
        .char-card .char-name { color: #fff; font-weight: 700; font-size: 0.95em; margin-bottom: 5px; }
        .char-card .char-ability { color: #aaa; font-size: 0.75em; }
        .char-card .card-progress {
            margin-top: 8px; height: 4px; background: rgba(255,255,255,0.1);
            border-radius: 2px; overflow: hidden;
        }
        .char-card .card-progress-fill {
            height: 100%; background: linear-gradient(90deg, #ff6b35, #ffd700);
            border-radius: 2px;
        }
        .char-card .card-count { color: #ffd700; font-size: 0.8em; margin-top: 4px; }
        .back-btn {
            position: absolute; top: 20px; left: 20px;
            background: rgba(255,255,255,0.1); border: none;
            color: #fff; padding: 10px 20px; border-radius: 8px;
            cursor: pointer; font-size: 1em;
        }

        /* Pause button */
        #pause-btn {
            position: fixed; top: 15px; right: 15px;
            background: rgba(0,0,0,0.5); border: none;
            color: #fff; width: 44px; height: 44px;
            border-radius: 50%; font-size: 1.3em;
            cursor: pointer; z-index: 810; display: none;
            pointer-events: auto;
        }
        #pause-btn.active { display: block; }

        /* Touch controls hint */
        #touch-hint {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.4); font-size: 0.85em;
            text-align: center; z-index: 800; pointer-events: none;
        }

        /* Chest popup */
        #chest-popup {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #1a1a4e, #2a2a6e);
            border: 2px solid #ffd700; border-radius: 16px;
            padding: 30px; text-align: center; display: none;
            z-index: 960; min-width: 280px;
        }
        #chest-popup.active { display: block; }
        #chest-popup h3 { color: #ffd700; font-size: 1.5em; margin-bottom: 15px; }
        .chest-rewards { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        .chest-reward-item {
            color: #fff; font-size: 1.1em;
            padding: 8px; background: rgba(255,255,255,0.1); border-radius: 8px;
        }
        .chest-reward-item.rare { color: #ff6b35; border: 1px solid rgba(255,107,53,0.3); }

        /* Notification toast */
        .toast {
            position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: #ffd700;
            padding: 12px 24px; border-radius: 8px; font-weight: 700;
            z-index: 970; animation: toastAnim 2s ease-out forwards;
            pointer-events: none;
        }
        @keyframes toastAnim {
            0% { transform: translateX(-50%) translateY(-20px); opacity: 0; }
            20% { transform: translateX(-50%) translateY(0); opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateX(-50%) translateY(-10px); opacity: 0; }
        }

        /* Daily missions */
        #missions-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(10,10,46,0.95) 0%, rgba(26,26,78,0.98) 100%);
            display: none; flex-direction: column; align-items: center;
            z-index: 900; overflow-y: auto; padding: 20px;
        }
        #missions-screen.active { display: flex; }
        #missions-screen h2 { color: #ff6b35; font-size: 2em; margin: 20px 0; }
        .mission-list { width: 100%; max-width: 500px; }
        .mission-item {
            background: rgba(255,255,255,0.08); border-radius: 10px;
            padding: 15px; margin-bottom: 10px; display: flex;
            justify-content: space-between; align-items: center;
        }
        .mission-info { flex: 1; }
        .mission-name { color: #fff; font-weight: 700; margin-bottom: 4px; }
        .mission-progress-text { color: #aaa; font-size: 0.85em; }
        .mission-progress-bar {
            height: 4px; background: rgba(255,255,255,0.1);
            border-radius: 2px; margin-top: 6px; overflow: hidden;
        }
        .mission-progress-fill {
            height: 100%; background: linear-gradient(90deg, #ff6b35, #ffd700);
            border-radius: 2px;
        }
        .mission-reward { color: #ffd700; font-weight: 700; font-size: 0.9em; white-space: nowrap; margin-left: 15px; }
    </style>
</head>
<body>

<!-- Loading Screen -->
<div id="loading-screen">
    <h1>STREET CHASE</h1>
    <p>Loading the city...</p>
    <div class="loading-bar-container">
        <div class="loading-bar" id="loading-bar"></div>
    </div>
</div>

<!-- Main Menu -->
<div id="main-menu">
    <div class="menu-stats">
        <div class="stat-item"><span class="stat-icon">🪙</span><span id="menu-coins">0</span></div>
        <div class="stat-item"><span class="stat-icon">💎</span><span id="menu-gems">0</span></div>
    </div>
    <h1>STREET CHASE</h1>
    <div class="subtitle">Urban Escape</div>
    <button class="menu-btn play" onclick="Game.startRun()">▶ PLAY</button>
    <button class="menu-btn secondary" onclick="Game.showCharacters()">👤 CHARACTERS</button>
    <button class="menu-btn secondary" onclick="Game.showMissions()">📋 MISSIONS</button>
    <div style="margin-top: 30px; color: rgba(255,255,255,0.3); font-size: 0.8em;">
        Best Score: <span id="menu-best-score">0</span> | Best Distance: <span id="menu-best-distance">0</span>m
    </div>
</div>

<!-- HUD -->
<div id="hud">
    <div class="hud-left">
        <div class="hud-item" id="score-display"><span class="icon">⭐</span><span class="value" id="hud-score">0</span></div>
        <div class="hud-item"><span class="icon">🪙</span><span class="value" id="hud-coins">0</span></div>
        <div id="distance-display">0m</div>
    </div>
    <div class="hud-right">
        <div class="hud-item" style="justify-content: flex-end;">
            <span id="hud-multiplier" style="color: #ff6b35;">x1</span>
        </div>
    </div>
</div>
<button id="pause-btn" onclick="Game.togglePause()">⏸</button>
<div id="active-powerup">
    <span class="powerup-name" id="powerup-name"></span>
    <div class="powerup-bar"><div class="powerup-fill" id="powerup-fill"></div></div>
</div>
<div id="powerup-indicator"></div>
<div id="touch-hint">Swipe to move • Swipe up to jump • Swipe down to slide</div>

<!-- Pause Menu -->
<div id="pause-menu">
    <h2>PAUSED</h2>
    <button class="menu-btn play" onclick="Game.togglePause()">▶ RESUME</button>
    <button class="menu-btn secondary" onclick="Game.quitToMenu()">🏠 MENU</button>
</div>

<!-- Game Over -->
<div id="game-over">
    <h2>BUSTED!</h2>
    <div class="final-score" id="final-score">0</div>
    <div class="final-distance" id="final-distance">0m</div>
    <div class="reward-container">
        <h3>Run Rewards</h3>
        <div class="reward-items">
            <div class="reward-item" id="reward-coins">🪙 0</div>
            <div class="reward-item" id="reward-chests">📦 0</div>
        </div>
    </div>
    <button class="menu-btn play" onclick="Game.startRun()">🔄 RUN AGAIN</button>
    <button class="menu-btn secondary" onclick="Game.quitToMenu()">🏠 MENU</button>
</div>

<!-- Characters Screen -->
<div id="shop-screen">
    <button class="back-btn" onclick="Game.hideShop()">← Back</button>
    <h2>CHARACTERS</h2>
    <div class="char-grid" id="char-grid"></div>
</div>

<!-- Missions Screen -->
<div id="missions-screen">
    <button class="back-btn" onclick="Game.hideMissions()">← Back</button>
    <h2>DAILY MISSIONS</h2>
    <div class="mission-list" id="mission-list"></div>
</div>

<!-- Chest Popup -->
<div id="chest-popup">
    <h3>📦 TREASURE CHEST!</h3>
    <div class="chest-rewards" id="chest-rewards"></div>
    <button class="menu-btn play" onclick="Game.closeChestPopup()" style="width: 200px;">COLLECT</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============================================================
// STREET CHASE RUNNER - Complete 3D Endless Runner Game
// ============================================================

const Game = {
    // State
    state: 'loading', // loading, menu, playing, paused, gameover
    score: 0,
    coins: 0,
    totalCoins: 0,
    gems: 0,
    distance: 0,
    speed: 0,
    baseSpeed: 0.4,
    maxSpeed: 1.0,
    speedIncrement: 0.00005,
    multiplier: 1,
    chestsCollected: 0,
    hitCount: 0,
    bestScore: 0,
    bestDistance: 0,
    
    // Three.js
    scene: null,
    camera: null,
    renderer: null,
    clock: null,
    
    // Player
    player: null,
    playerLane: 1, // 0=left, 1=center, 2=right
    targetLaneX: 0,
    isJumping: false,
    isSliding: false,
    jumpVelocity: 0,
    playerY: 0,
    slideTimer: 0,
    invincible: false,
    invincibleTimer: 0,
    
    // Lane config
    laneWidth: 3.5,
    lanes: [-3.5, 0, 3.5],
    
    // Objects pools
    obstacles: [],
    collectibles: [],
    buildings: [],
    roadSegments: [],
    decorations: [],
    particles: [],
    
    // Police
    police: null,
    policeDistance: 15,
    policeTargetDistance: 15,
    
    // Power-ups
    activePowerup: null,
    powerupTimer: 0,
    powerupDuration: 0,
    shieldActive: false,
    magnetActive: false,
    invisibleActive: false,
    superJumpActive: false,
    speedBoostActive: false,
    
    // Environment
    dayNightCycle: 0,
    isNight: false,
    weatherType: 'clear', // clear, rain, fog
    rainParticles: [],
    streetLights: [],
    
    // Spawn timers
    obstacleSpawnTimer: 0,
    collectibleSpawnTimer: 0,
    chestSpawnTimer: 0,
    powerupSpawnTimer: 0,
    
    // Characters
    characters: [
        { id: 'thief', name: 'Street Thief', ability: 'Default runner', color: 0x333333, accent: 0xff6b35, cards: 12, unlocked: true },
        { id: 'hacker', name: 'Street Hacker', ability: '+20% coin magnet range', color: 0x1a1a2e, accent: 0x00ff88, cards: 0, unlocked: false },
        { id: 'parkour', name: 'Parkour Expert', ability: '+30% jump height', color: 0x2d2d2d, accent: 0xff4444, cards: 0, unlocked: false },
        { id: 'biker', name: 'Bike Messenger', ability: '+15% speed boost duration', color: 0x4a4a00, accent: 0xffff00, cards: 0, unlocked: false },
        { id: 'masked', name: 'Masked Thief', ability: '+25% invisibility duration', color: 0x1a0a2e, accent: 0xaa44ff, cards: 0, unlocked: false },
        { id: 'night', name: 'Night Runner', ability: '+20% score at night', color: 0x0a0a0a, accent: 0x4488ff, cards: 0, unlocked: false },
    ],
    selectedCharacter: 0,
    
    // Missions
    missions: [
        { name: 'Collect 100 coins in one run', target: 100, progress: 0, reward: 50, type: 'coins_run' },
        { name: 'Run 500 meters', target: 500, progress: 0, reward: 100, type: 'distance' },
        { name: 'Collect 3 treasure chests', target: 3, progress: 0, reward: 200, type: 'chests' },
        { name: 'Use 2 power-ups in one run', target: 2, progress: 0, reward: 75, type: 'powerups' },
        { name: 'Score 5000 points', target: 5000, progress: 0, reward: 150, type: 'score' },
    ],
    powerupsUsedThisRun: 0,

    // Touch controls
    touchStartX: 0,
    touchStartY: 0,
    touchStartTime: 0,
    
    // Audio context
    audioCtx: null,
    musicPlaying: false,
    
    // Materials cache
    materials: {},
    
    // Animation
    animTime: 0,
    runBob: 0,

    // ============================================================
    // INITIALIZATION
    // ============================================================
    
    init() {
        this.loadSaveData();
        this.initThree();
        this.initMaterials();
        this.initLighting();
        this.initPlayer();
        this.initPolice();
        this.initEnvironment();
        this.initControls();
        this.initAudio();
        
        // Simulate loading
        let progress = 0;
        const loadInterval = setInterval(() => {
            progress += Math.random() * 15 + 5;
            if (progress > 100) progress = 100;
            document.getElementById('loading-bar').style.width = progress + '%';
            if (progress >= 100) {
                clearInterval(loadInterval);
                setTimeout(() => {
                    document.getElementById('loading-screen').classList.add('hidden');
                    this.showMenu();
                }, 500);
            }
        }, 200);
        
        this.animate();
    },
    
    initThree() {
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x87CEEB);
        this.scene.fog = new THREE.Fog(0x87CEEB, 60, 150);
        
        this.camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 200);
        this.camera.position.set(0, 8, 12);
        this.camera.lookAt(0, 1, -10);
        
        this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.shadowMap.enabled = true;
        this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
        this.renderer.toneMappingExposure = 1.0;
        document.body.appendChild(this.renderer.domElement);
        
        this.clock = new THREE.Clock();
        
        window.addEventListener('resize', () => {
            this.camera.aspect = window.innerWidth / window.innerHeight;
            this.camera.updateProjectionMatrix();
            this.renderer.setSize(window.innerWidth, window.innerHeight);
        });
    },
    
    initMaterials() {
        this.materials = {
            road: new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.9 }),
            roadLine: new THREE.MeshStandardMaterial({ color: 0xFFFFFF, roughness: 0.5 }),
            roadYellow: new THREE.MeshStandardMaterial({ color: 0xFFCC00, roughness: 0.5 }),
            sidewalk: new THREE.MeshStandardMaterial({ color: 0x999999, roughness: 0.8 }),
            building: new THREE.MeshStandardMaterial({ color: 0x666677, roughness: 0.7 }),
            buildingDark: new THREE.MeshStandardMaterial({ color: 0x444455, roughness: 0.7 }),
            buildingLight: new THREE.MeshStandardMaterial({ color: 0x888899, roughness: 0.6 }),
            window: new THREE.MeshStandardMaterial({ color: 0x88CCFF, roughness: 0.2, metalness: 0.5 }),

    // ============================================================
    // ENVIRONMENT
    // ============================================================
    
    initEnvironment() {
        // Ground plane
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(200, 400),
            this.materials.grass
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.01;
        ground.position.z = -100;
        ground.receiveShadow = true;
        this.scene.add(ground);
        
        // Generate initial road and buildings
        for (let z = 20; z > -150; z -= 10) {
            this.spawnRoadSegment(z);
        }
        for (let z = 15; z > -150; z -= 12) {
            this.spawnBuildings(z);
        }
    },
    
    spawnRoadSegment(z) {
        const segment = new THREE.Group();
        
        // Main road
        const road = new THREE.Mesh(new THREE.PlaneGeometry(14, 10), this.materials.road);
        road.rotation.x = -Math.PI / 2;
        road.position.y = 0.01;
        road.receiveShadow = true;
        segment.add(road);
        
        // Sidewalks
        const leftSidewalk = new THREE.Mesh(new THREE.BoxGeometry(4, 0.15, 10), this.materials.sidewalk);
        leftSidewalk.position.set(-9, 0.075, 0);
        leftSidewalk.receiveShadow = true;
        segment.add(leftSidewalk);
        
        const rightSidewalk = new THREE.Mesh(new THREE.BoxGeometry(4, 0.15, 10), this.materials.sidewalk);
        rightSidewalk.position.set(9, 0.075, 0);
        rightSidewalk.receiveShadow = true;
        segment.add(rightSidewalk);
        
        // Curbs
        const leftCurb = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 10), new THREE.MeshStandardMaterial({ color: 0x777777 }));
        leftCurb.position.set(-7.15, 0.1, 0);
        segment.add(leftCurb);
        
        const rightCurb = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 10), new THREE.MeshStandardMaterial({ color: 0x777777 }));
        rightCurb.position.set(7.15, 0.1, 0);
        segment.add(rightCurb);
        
        // Lane markings
        for (let lz = -4; lz <= 4; lz += 2) {
            // Left lane line
            const leftLine = new THREE.Mesh(new THREE.PlaneGeometry(0.15, 1.2), this.materials.roadLine);
            leftLine.rotation.x = -Math.PI / 2;
            leftLine.position.set(-this.laneWidth/2 - 0.2, 0.02, lz);
            segment.add(leftLine);
            
            // Right lane line
            const rightLine = new THREE.Mesh(new THREE.PlaneGeometry(0.15, 1.2), this.materials.roadLine);
            rightLine.rotation.x = -Math.PI / 2;
            rightLine.position.set(this.laneWidth/2 + 0.2, 0.02, lz);
            segment.add(rightLine);
        }
        
        // Center yellow lines
        for (let lz = -4; lz <= 4; lz += 3) {
            const yellowLine = new THREE.Mesh(new THREE.PlaneGeometry(0.12, 2), this.materials.roadYellow);
            yellowLine.rotation.x = -Math.PI / 2;
            yellowLine.position.set(0, 0.02, lz);
            segment.add(yellowLine);
        }
        
        // Street lights (occasionally)
        if (Math.random() > 0.5) {
            const side = Math.random() > 0.5 ? 1 : -1;
            const lightPost = this.createStreetLight();
            lightPost.position.set(side * 7.5, 0, 0);
            segment.add(lightPost);
        }
        
        segment.position.z = z;
        this.scene.add(segment);
        this.roadSegments.push(segment);
    },
    
    createStreetLight() {
        const group = new THREE.Group();
        
        // Pole
        const pole = new THREE.Mesh(
            new THREE.CylinderGeometry(0.08, 0.1, 5, 8),
            new THREE.MeshStandardMaterial({ color: 0x555555, metalness: 0.7 })
        );
        pole.position.y = 2.5;
        group.add(pole);
        
        // Arm
        const arm = new THREE.Mesh(
            new THREE.BoxGeometry(1.5, 0.08, 0.08),
            new THREE.MeshStandardMaterial({ color: 0x555555, metalness: 0.7 })
        );
        arm.position.set(-0.5, 5, 0);
        group.add(arm);
        
        // Light fixture
        const fixture = new THREE.Mesh(
            new THREE.BoxGeometry(0.4, 0.1, 0.2),
            new THREE.MeshStandardMaterial({ color: 0xFFFFDD, emissive: 0xFFFFDD, emissiveIntensity: this.isNight ? 1.0 : 0.1 })
        );
        fixture.position.set(-1.2, 4.9, 0);
        group.add(fixture);
        
        // Point light (only visible at night, added dynamically)
        const light = new THREE.PointLight(0xFFDD88, this.isNight ? 1.5 : 0.0, 15);
        light.position.set(-1.2, 4.8, 0);
        group.add(light);
        group.streetLight = light;
        group.fixture = fixture;
        
        this.streetLights.push(group);
        return group;
    },
    
    spawnBuildings(z) {
        for (let side = -1; side <= 1; side += 2) {
            const numBuildings = Math.floor(Math.random() * 2) + 1;
            for (let i = 0; i < numBuildings; i++) {
                const bGroup = new THREE.Group();
                const height = Math.random() * 15 + 5;
                const width = Math.random() * 4 + 3;
                const depth = Math.random() * 4 + 3;
                
                const mats = [this.materials.building, this.materials.buildingDark, this.materials.buildingLight];
                const mat = mats[Math.floor(Math.random() * mats.length)];
                
                const building = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), mat);
                building.position.y = height / 2;
                building.castShadow = true;
                building.receiveShadow = true;
                bGroup.add(building);
                
                // Windows
                const windowMat = this.isNight && Math.random() > 0.4 ? this.materials.windowLit : this.materials.window;
                const windowRows = Math.floor(height / 2);
                const windowCols = Math.floor(width / 1.2);
                for (let row = 0; row < windowRows; row++) {
                    for (let col = 0; col < windowCols; col++) {
                        if (Math.random() > 0.3) {
                            const win = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.8), windowMat);
                            win.position.set(
                                -width/2 + 0.8 + col * 1.2,
                                1.5 + row * 2,
                                depth/2 + 0.01
                            );
                            if (side > 0) win.rotation.y = Math.PI;
                            bGroup.add(win);
                        }
                    }
                }
                
                // Rooftop details
                if (Math.random() > 0.5) {
                    const ac = new THREE.Mesh(
                        new THREE.BoxGeometry(1, 0.5, 0.8),
                        new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.5 })
                    );
                    ac.position.set(Math.random() * 2 - 1, height + 0.25, 0);
                    bGroup.add(ac);
                }
                
                const xPos = side * (11 + i * (width + 1) + Math.random() * 2);
                bGroup.position.set(xPos, 0, z + Math.random() * 6 - 3);
                this.scene.add(bGroup);
                this.buildings.push(bGroup);
                
                // Occasional tree on sidewalk
                if (Math.random() > 0.7) {
                    const tree = this.createTree();
                    tree.position.set(side * 8.5, 0.15, z + Math.random() * 8 - 4);
                    this.scene.add(tree);
                    this.decorations.push(tree);
                }
            }
        }
    },
    
    createTree() {
        const group = new THREE.Group();
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.15, 1.5, 6), this.materials.trunk);
        trunk.position.y = 0.75;

        const foliage = new THREE.Mesh(new THREE.SphereGeometry(0.8, 8, 6), this.materials.tree);
        foliage.position.y = 2;

        group.add(foliage);
        
        return group;
    },
    
    // ============================================================
    // OBSTACLE CREATION
    // ============================================================
    
    createObstacle(type, lane) {
        const group = new THREE.Group();
        group.obstacleType = type;
        group.lane = lane;
        group.isLow = false; // can jump over
        group.isHigh = false; // can slide under
        
        switch (type) {
            case 'car': {
                const colors = [0xCC2222, 0x2255AA, 0xFFFF33, 0x22CC22, 0xCC22CC, 0x222222, 0xFFFFFF, 0xFF8800];
                const carColor = new THREE.MeshStandardMaterial({
                    color: colors[Math.floor(Math.random() * colors.length)],
                    roughness: 0.3, metalness: 0.6
                });
                // Body
                const body = new THREE.Mesh(new THREE.BoxGeometry(2.0, 1.0, 3.5), carColor);
                body.position.y = 0.7;
                body.castShadow = true;
                group.add(body);
                // Roof
                const roof = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.7, 2.0), carColor);
                roof.position.y = 1.5;
                roof.position.z = -0.2;
                group.add(roof);
                // Windshield
                const windshield = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.6), this.materials.window);
                windshield.position.set(0, 1.4, 0.85);
                windshield.rotation.x = -0.2;
                group.add(windshield);
                // Headlights
                const hlMat = new THREE.MeshStandardMaterial({ color: 0xFFFFCC, emissive: 0xFFFFCC, emissiveIntensity: 0.5 });
                const hl1 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 0.1), hlMat);
                hl1.position.set(-0.7, 0.6, 1.76);
                group.add(hl1);
                const hl2 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 0.1), hlMat);
                hl2.position.set(0.7, 0.6, 1.76);
                group.add(hl2);
                // Taillights
                const tlMat = new THREE.MeshStandardMaterial({ color: 0xFF0000, emissive: 0xFF0000, emissiveIntensity: 0.3 });
                const tl1 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.15, 0.1), tlMat);
                tl1.position.set(-0.7, 0.6, -1.76);
                group.add(tl1);
                const tl2 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.15, 0.1), tlMat);
                tl2.position.set(0.7, 0.6, -1.76);
                group.add(tl2);
                // Wheels
                const wheelGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.2, 8);
                const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
                [[-0.9,0.3,1], [0.9,0.3,1], [-0.9,0.3,-1], [0.9,0.3,-1]].forEach(p => {
                    const w = new THREE.Mesh(wheelGeo, wheelMat);
                    w.rotation.z = Math.PI/2;
                    w.position.set(...p);
                    group.add(w);
                });
                group.isLow = false;
                group.isHigh = false;
                group.hitboxSize = { x: 1.8, y: 1.8, z: 3.0 };
                break;
            }
            case 'bus': {
                const busBody = new THREE.Mesh(new THREE.BoxGeometry(2.4, 2.5, 6), this.materials.bus);
                busBody.position.y = 1.5;
                busBody.castShadow = true;
                group.add(busBody);
                // Windows
                for (let wz = -2; wz <= 2; wz += 1) {
                    const bw = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.8), this.materials.window);
                    bw.position.set(1.21, 2.0, wz);
                    group.add(bw);
                    const bw2 = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.8), this.materials.window);
                    bw2.position.set(-1.21, 2.0, wz);
                    bw2.rotation.y = Math.PI;
                    group.add(bw2);
                }
                // Front
                const busWindshield = new THREE.Mesh(new THREE.PlaneGeometry(2.0, 1.2), this.materials.window);
                busWindshield.position.set(0, 2.2, 3.01);
                group.add(busWindshield);
                // Wheels
                const bwGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.25, 8);
                const bwMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
                [[-1.1,0.4,2], [1.1,0.4,2], [-1.1,0.4,-2], [1.1,0.4,-2]].forEach(p => {
                    const w = new THREE.Mesh(bwGeo, bwMat);
                    w.rotation.z = Math.PI/2;
                    w.position.set(...p);

    // ============================================================
    // CONTROLS
    // ============================================================
    
    initControls() {
        // Keyboard
        document.addEventListener('keydown', (e) => {
            if (this.state !== 'playing') return;
            switch (e.key) {
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    this.moveLeft(); break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    this.moveRight(); break;
                case 'ArrowUp':
                case 'w':
                case 'W':
                case ' ':
                    this.jump(); break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    this.slide(); break;
                case 'Escape':
                case 'p':
                case 'P':
                    this.togglePause(); break;
            }
        });
        
        // Touch controls
        document.addEventListener('touchstart', (e) => {
            if (this.state !== 'playing') return;
            this.touchStartX = e.touches[0].clientX;
            this.touchStartY = e.touches[0].clientY;
            this.touchStartTime = Date.now();
        }, { passive: true });
        
        document.addEventListener('touchend', (e) => {
            if (this.state !== 'playing') return;
            const dx = e.changedTouches[0].clientX - this.touchStartX;
            const dy = e.changedTouches[0].clientY - this.touchStartY;
            const dt = Date.now() - this.touchStartTime;
            
            const minSwipe = 30;
            const absDx = Math.abs(dx);
            const absDy = Math.abs(dy);
            
            if (Math.max(absDx, absDy) < minSwipe && dt < 300) {
                // Tap = jump
                this.jump();
                return;
            }
            
            if (absDx > absDy) {
                if (dx > minSwipe) this.moveRight();
                else if (dx < -minSwipe) this.moveLeft();
            } else {
                if (dy < -minSwipe) this.jump();
                else if (dy > minSwipe) this.slide();
            }
        }, { passive: true });
    },
    
    moveLeft() {
        if (this.playerLane > 0) {
            this.playerLane--;
            this.playSound('swoosh');
        }
    },
    
    moveRight() {
        if (this.playerLane < 2) {
            this.playerLane++;
            this.playSound('swoosh');
        }
    },
    
    jump() {
        if (!this.isJumping && !this.isSliding) {
            this.isJumping = true;
            this.jumpVelocity = this.superJumpActive ? 0.35 : 0.25;
            this.playSound('jump');
        }
    },
    
    slide() {
        if (!this.isJumping && !this.isSliding) {
            this.isSliding = true;
            this.slideTimer = 0.6;
            this.playSound('slide');
        }
    },
    
    // ============================================================
    // AUDIO
    // ============================================================
    
    initAudio() {
        this.audioCtx = null;
    },
    
    ensureAudio() {
        if (!this.audioCtx) {
            this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.audioCtx.state === 'suspended') {
            this.audioCtx.resume();
        }
    },
    
    playSound(type) {
        try {
            this.ensureAudio();
            const ctx = this.audioCtx;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            switch (type) {
                case 'coin':
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.15);
                    break;
                case 'chest':
                    osc.frequency.setValueAtTime(440, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
                    osc.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.4);
                    break;
                case 'powerup':
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(523, ctx.currentTime);
                    osc.frequency.setValueAtTime(659, ctx.currentTime + 0.1);
                    osc.frequency.setValueAtTime(784, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.12, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.35);
                    break;
                case 'jump':
                    osc.frequency.setValueAtTime(300, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.12);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.15);
                    break;
                case 'slide':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.2);
                    break;
                case 'swoosh':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.06, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.1);
                    break;
                case 'hit':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.25, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.4);
                    break;
                case 'gameover':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(400, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.5);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.6);
                    break;
                case 'siren':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(900, ctx.currentTime + 0.3);
                    osc.frequency.linearRampToValueAtTime(600, ctx.currentTime + 0.6);
                    gain.gain.setValueAtTime(0.05, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.7);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.7);
                    break;
            }
        } catch (e) { /* Audio not available */ }
    },
    
    startMusic() {
        if (this.musicPlaying) return;
        try {
            this.ensureAudio();
            this.musicPlaying = true;
            this.playMusicLoop();
        } catch (e) {}
    },
    
    playMusicLoop() {
        if (!this.musicPlaying || this.state !== 'playing') return;
        try {
            const ctx = this.audioCtx;
            const now = ctx.currentTime;
            
            // Simple bass line
            const bassNotes = [110, 130.81, 146.83, 130.81];
            bassNotes.forEach((freq, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sine';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.06, now + i * 0.25);
                gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.25 + 0.2);
                osc.start(now + i * 0.25);
                osc.stop(now + i * 0.25 + 0.22);
            });
            
            // Rhythm
            for (let i = 0; i < 4; i++) {
                const noise = ctx.createOscillator();
                const nGain = ctx.createGain();
                noise.connect(nGain);
                nGain.connect(ctx.destination);
                noise.type = 'square';
                noise.frequency.value = 80;
                nGain.gain.setValueAtTime(i % 2 === 0 ? 0.04 : 0.02, now + i * 0.25);
                nGain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.25 + 0.05);
                noise.start(now + i * 0.25);
                noise.stop(now + i * 0.25 + 0.06);
            }
            
            setTimeout(() => this.playMusicLoop(), 1000);
        } catch (e) {}
    },
    
    stopMusic() {
        this.musicPlaying = false;
    },

    startRun() {
        this.state = 'playing';
        this.score = 0;
        this.coins = 0;
        this.distance = 0;
        this.speed = this.baseSpeed;
        this.multiplier = 1;
        this.chestsCollected = 0;
        this.hitCount = 0;
        this.playerLane = 1;
        this.isJumping = false;
        this.isSliding = false;
        this.playerY = 0;
        this.jumpVelocity = 0;
        this.slideTimer = 0;
        this.invincible = false;
        this.invincibleTimer = 0;
        this.activePowerup = null;
        this.powerupTimer = 0;
        this.shieldActive = false;
        this.magnetActive = false;
        this.invisibleActive = false;
        this.superJumpActive = false;
        this.speedBoostActive = false;
        this.policeDistance = 15;
        this.policeTargetDistance = 15;
        this.obstacleSpawnTimer = 0;
        this.collectibleSpawnTimer = 0;
        this.chestSpawnTimer = 0;
        this.powerupSpawnTimer = 0;
        this.animTime = 0;
        this.powerupsUsedThisRun = 0;
        
        // Reset missions progress for per-run missions
        this.missions.forEach(m => {
            if (m.type === 'coins_run' || m.type === 'powerups') m.progress = 0;
        });
        
        // Clear existing objects
        this.clearGameObjects();
        
        // Reset player
        this.rebuildPlayer();
        this.player.position.set(0, 0, 0);
        
        // Reset police
        this.police.position.set(0, 0, this.policeDistance);
        
        // Regenerate environment
        for (let z = 20; z > -150; z -= 10) {
            this.spawnRoadSegment(z);
        }
        for (let z = 15; z > -150; z -= 12) {
            this.spawnBuildings(z);
        }
        
        // UI
        document.getElementById('main-menu').classList.remove('active');
        document.getElementById('game-over').classList.remove('active');
        document.getElementById('hud').classList.add('active');
        document.getElementById('pause-btn').classList.add('active');
        document.getElementById('touch-hint').style.display = 'block';
        
        this.startMusic();
        
        setTimeout(() => {
            document.getElementById('touch-hint').style.display = 'none';
        }, 5000);
    },
    
    clearGameObjects() {
        this.obstacles.forEach(o => this.scene.remove(o));
        this.obstacles = [];
        this.collectibles.forEach(c => this.scene.remove(c));
        this.collectibles = [];
        this.roadSegments.forEach(r => this.scene.remove(r));
        this.roadSegments = [];
        this.buildings.forEach(b => this.scene.remove(b));
        this.buildings = [];
        this.decorations.forEach(d => this.scene.remove(d));
        this.decorations = [];
        this.particles.forEach(p => this.scene.remove(p));
        this.particles = [];
        this.streetLights = [];
    },
    
    togglePause() {
        if (this.state === 'playing') {
            this.state = 'paused';
            document.getElementById('pause-menu').classList.add('active');
            this.stopMusic();
        } else if (this.state === 'paused') {
            this.state = 'playing';
            document.getElementById('pause-menu').classList.remove('active');
            this.startMusic();
        }
    },
    
    gameOver() {
        this.state = 'gameover';
        this.stopMusic();
        this.playSound('gameover');
        
        // Update best scores
        if (this.score > this.bestScore) this.bestScore = this.score;
        const dist = Math.floor(this.distance);
        if (dist > this.bestDistance) this.bestDistance = dist;
        
        // Add coins to total
        this.totalCoins += this.coins;
        
        // Update missions
        this.missions.forEach(m => {
            if (m.type === 'distance') m.progress = Math.max(m.progress, dist);
            if (m.type === 'score') m.progress = Math.max(m.progress, this.score);
            if (m.type === 'chests') m.progress += this.chestsCollected;
        });
        
        // Show game over screen
        document.getElementById('final-score').textContent = this.score;
        document.getElementById('final-distance').textContent = dist + 'm';
        document.getElementById('reward-coins').textContent = '🪙 ' + this.coins;
        document.getElementById('reward-chests').textContent = '📦 ' + this.chestsCollected;
        document.getElementById('game-over').classList.add('active');
        document.getElementById('hud').classList.remove('active');
        document.getElementById('pause-btn').classList.remove('active');
        document.getElementById('active-powerup').classList.remove('active');
        
        this.saveData();
    },
    
    quitToMenu() {
        document.getElementById('pause-menu').classList.remove('active');
        document.getElementById('game-over').classList.remove('active');
        this.stopMusic();
        this.showMenu();
    },
    
    // ============================================================

    showCharacters() {
        document.getElementById('main-menu').classList.remove('active');
        document.getElementById('shop-screen').classList.add('active');
        this.renderCharacterGrid();
    },
    
    hideShop() {
        document.getElementById('shop-screen').classList.remove('active');
        document.getElementById('main-menu').classList.add('active');
    },
    
    renderCharacterGrid() {
        const grid = document.getElementById('char-grid');
        grid.innerHTML = '';
        this.characters.forEach((char, i) => {
            const card = document.createElement('div');
            card.className = 'char-card' + (i === this.selectedCharacter ? ' selected' : '') + (!char.unlocked ? ' locked' : '');
            
            const accentHex = '#' + char.accent.toString(16).padStart(6, '0');
            const colorHex = '#' + char.color.toString(16).padStart(6, '0');
            
            card.innerHTML = `
                <div class="char-avatar" style="background: linear-gradient(135deg, ${colorHex}, ${accentHex});">
                    ${char.unlocked ? '🏃' : '🔒'}
                </div>
                <div class="char-name">${char.name}</div>
                <div class="char-ability">${char.ability}</div>
                ${!char.unlocked ? `
                    <div class="card-progress">
                        <div class="card-progress-fill" style="width: ${(char.cards / 12) * 100}%"></div>
                    </div>
                    <div class="card-count">${char.cards}/12 cards</div>
                ` : (i === this.selectedCharacter ? '<div class="card-count" style="color: #ff6b35;">EQUIPPED</div>' : '<div class="card-count">Tap to equip</div>')}
            `;
            
            card.onclick = () => {
                if (char.unlocked) {
                    this.selectedCharacter = i;
                    this.renderCharacterGrid();
                    this.showToast(`${char.name} equipped!`);
                    this.saveData();
                } else if (char.cards >= 12) {
                    char.unlocked = true;
                    char.cards -= 12;
                    this.selectedCharacter = i;
                    this.renderCharacterGrid();
                    this.showToast(`${char.name} UNLOCKED!`);
                    this.saveData();
                } else {
                    this.showToast(`Need ${12 - char.cards} more cards`);
                }
            };
            
            grid.appendChild(card);
        });
    },

    // MISSIONS
    // ============================================================
    
    showMissions() {
        document.getElementById('main-menu').classList.remove('active');
        document.getElementById('missions-screen').classList.add('active');
        this.renderMissions();
    },
    
    hideMissions() {
        document.getElementById('missions-screen').classList.remove('active');
        document.getElementById('main-menu').classList.add('active');
    },
    
    renderMissions() {
        const list = document.getElementById('mission-list');

            const prog = Math.min(m.progress / m.target, 1);
            const completed = prog >= 1;
            const item = document.createElement('div');
            item.className = 'mission-item';
            item.innerHTML = `
                <div class="mission-info">
                    <div class="mission-name" style="${completed ? 'color: #44FF44;' : ''}">${completed ? '✓ ' : ''}${m.name}</div>
                    <div class="mission-progress-text">${Math.min(m.progress, m.target)} / ${m.target}</div>
                    <div class="mission-progress-bar">
                        <div class="mission-progress-fill" style="width: ${prog * 100}%"></div>
                    </div>
                </div>
                <div class="mission-reward">${completed ? 'DONE' : '🪙 ' + m.reward}</div>
            `;
            
            if (completed && !m.claimed) {
                item.style.cursor = 'pointer';
                item.querySelector('.mission-reward').textContent = 'CLAIM';
                item.querySelector('.mission-reward').style.color = '#44FF44';
                item.onclick = () => {
                    this.totalCoins += m.reward;
                    m.claimed = true;
                    this.showToast(`+${m.reward} coins!`);
                    this.renderMissions();
                    this.saveData();
                };

            list.appendChild(item);
        });

    // ============================================================
    // CHEST SYSTEM
    // ============================================================
    
    openChest() {
        const rewards = [];
        
        // Coins (always)
        const coinReward = Math.floor(Math.random() * 50) + 20;
        this.totalCoins += coinReward;
        rewards.push({ text: `🪙 ${coinReward} Coins`, rare: false });
        
        // Random chance for character card
        if (Math.random() > 0.5) {
            const lockedChars = this.characters.filter(c => !c.unlocked || c.cards < 12);
            if (lockedChars.length > 0) {
                const char = lockedChars[Math.floor(Math.random() * lockedChars.length)];
                char.cards = Math.min(char.cards + 1, 12);
                rewards.push({ text: `🃏 ${char.name} Card (${char.cards}/12)`, rare: true });
            }
        }
        
        // Random gems
        if (Math.random() > 0.7) {
            const gemReward = Math.floor(Math.random() * 5) + 1;
            this.gems += gemReward;
            rewards.push({ text: `💎 ${gemReward} Gems`, rare: true });
        }
        
        this.showChestPopup(rewards);
        this.saveData();
    },

        rewards.forEach(r => {
            const div = document.createElement('div');

            container.appendChild(div);
