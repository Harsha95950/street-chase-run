    spawnParticles(x, y, z, color, count) {
        for (let i = 0; i < count; i++) {
            const particle = new THREE.Mesh(
                new THREE.BoxGeometry(0.1, 0.1, 0.1),
                new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.5 })
            );
            particle.position.set(x, y, z);
            particle.velocity = new THREE.Vector3(
                (Math.random() - 0.5) * 0.2,
                Math.random() * 0.15 + 0.05,
                (Math.random() - 0.5) * 0.2
            );
            particle.life = 1.0;
            this.scene.add(particle);
            this.particles.push(particle);
        }
    },
    
    // ============================================================
    // SAVE/LOAD
    // ============================================================
    
    saveData() {
        const data = {
            totalCoins: this.totalCoins,
            gems: this.gems,
            bestScore: this.bestScore,
            bestDistance: this.bestDistance,
            selectedCharacter: this.selectedCharacter,
            characters: this.characters.map(c => ({ cards: c.cards, unlocked: c.unlocked })),
            missions: this.missions.map(m => ({ progress: m.progress, claimed: m.claimed })),
        };
        try {
            localStorage.setItem('streetChaseData', JSON.stringify(data));
        } catch (e) {}
    },
    
    loadSaveData() {
        try {
            const raw = localStorage.getItem('streetChaseData');
            if (raw) {
                const data = JSON.parse(raw);
                this.totalCoins = data.totalCoins || 0;
                this.gems = data.gems || 0;
                this.bestScore = data.bestScore || 0;
                this.bestDistance = data.bestDistance || 0;
                this.selectedCharacter = data.selectedCharacter || 0;
                if (data.characters) {
                    data.characters.forEach((c, i) => {
                        if (this.characters[i]) {
                            this.characters[i].cards = c.cards;
                            this.characters[i].unlocked = c.unlocked;
                        }
                    });
                }
                if (data.missions) {
                    data.missions.forEach((m, i) => {
                        if (this.missions[i]) {
                            this.missions[i].progress = m.progress || 0;
                            this.missions[i].claimed = m.claimed || false;
                        }
                    });
                }
            }
        } catch (e) {}
    },
    
    // ============================================================
    // ACTIVATE POWER-UP
    // ============================================================
    
    activatePowerup(type) {
        this.activePowerup = type;
        this.powerupsUsedThisRun++;
        
        // Update powerups mission
        this.missions.forEach(m => {
            if (m.type === 'powerups') m.progress = this.powerupsUsedThisRun;
        });
        
        const durations = {
            'invisibility': 5,
            'superjump': 8,
            'speed': 6,
            'magnet': 8,
            'shield': 0 // instant
        };
        const names = {
            'invisibility': '👻 INVISIBILITY',
            'superjump': '⬆️ SUPER JUMP',
            'speed': '⚡ SPEED BOOST',
            'magnet': '🧲 MAGNET',
            'shield': '🛡️ SHIELD'
        };
        
        this.showPowerupIndicator(names[type]);
        this.playSound('powerup');
        
        // Reset previous power-up effects
        this.shieldActive = false;
        this.magnetActive = false;
        this.invisibleActive = false;
        this.superJumpActive = false;
        this.speedBoostActive = false;
        this.player.shieldMesh.visible = false;
        
        switch (type) {
            case 'invisibility':
                this.invisibleActive = true;
                this.powerupDuration = durations[type];
                this.powerupTimer = durations[type];
                // Apply character bonus
                if (this.characters[this.selectedCharacter].id === 'masked') {
                    this.powerupTimer *= 1.25;
                    this.powerupDuration *= 1.25;
                }
                break;
            case 'superjump':
                this.superJumpActive = true;
                this.powerupDuration = durations[type];
                this.powerupTimer = durations[type];
                break;
            case 'speed':
                this.speedBoostActive = true;
                this.powerupDuration = durations[type];
                this.powerupTimer = durations[type];
                if (this.characters[this.selectedCharacter].id === 'biker') {
                    this.powerupTimer *= 1.15;
                    this.powerupDuration *= 1.15;
                }
                break;
            case 'magnet':
                this.magnetActive = true;
                this.powerupDuration = durations[type];
                this.powerupTimer = durations[type];
                break;
            case 'shield':
                this.shieldActive = true;
                this.player.shieldMesh.visible = true;
                this.activePowerup = null; // instant, no timer
                return;
        }
        
        // Show active powerup bar
        document.getElementById('powerup-name').textContent = names[type];
        document.getElementById('active-powerup').classList.add('active');
    },
    
    // ============================================================
    // COLLISION DETECTION
    // ============================================================
    
    checkCollisions() {
        const playerX = this.player.position.x;
        const playerZ = this.player.position.z;
        const playerHalfWidth = 0.4;
        const playerHeight = this.isSliding ? 0.8 : 2.5;
        const playerBottom = this.playerY;
        
        for (let i = this.obstacles.length - 1; i >= 0; i--) {
            const obs = this.obstacles[i];
            const hb = obs.hitboxSize || { x: 1.5, y: 1.5, z: 1.5 };
            
            const dx = Math.abs(playerX - obs.position.x);
            const dz = Math.abs(playerZ - obs.position.z);
            
            if (dx < (hb.x / 2 + playerHalfWidth) && dz < (hb.z / 2 + 0.4)) {
                // Check vertical
                if (obs.isLow && playerBottom > 0.8) continue; // jumped over
                if (obs.isHigh && this.isSliding) continue; // slid under
                
                // Collision!
                if (this.invisibleActive) continue; // invisible, no collision
                
                if (this.shieldActive) {
                    this.shieldActive = false;
                    this.player.shieldMesh.visible = false;
                    // Remove obstacle
                    this.scene.remove(obs);
                    this.obstacles.splice(i, 1);
                    this.spawnParticles(obs.position.x, 1, obs.position.z, 0x4488FF, 10);
                    this.playSound('hit');
                    this.showToast('Shield used!');
                    continue;
                }
                
                if (this.invincible) continue;
                
                // Hit!
                this.hitCount++;
                this.playSound('hit');
                this.spawnParticles(playerX, 1, playerZ, 0xFF4444, 8);
                
                // Police gets closer
                this.policeTargetDistance -= 3;
                
                // Invincibility frames
                this.invincible = true;
                this.invincibleTimer = 1.5;
                
                if (this.policeTargetDistance <= 2) {
                    this.gameOver();
                    return;
                }
            }
        }
    },
    
    checkCollectibles() {
        const playerX = this.player.position.x;
        const playerZ = this.player.position.z;
        const magnetRange = this.magnetActive ? 8 : 2;
        const hackerBonus = this.characters[this.selectedCharacter].id === 'hacker' ? 1.2 : 1.0;
        
        for (let i = this.collectibles.length - 1; i >= 0; i--) {
            const col = this.collectibles[i];
            if (col.collected) continue;
            
            const dx = Math.abs(playerX - col.position.x);
            const dz = Math.abs(playerZ - col.position.z);
            const dist = Math.sqrt(dx * dx + dz * dz);
            
            // Magnet effect
            if (this.magnetActive && col.collectibleType === 'coin' && dist < magnetRange * hackerBonus) {
                const dir = new THREE.Vector3(playerX - col.position.x, 0, playerZ - col.position.z).normalize();
                col.position.x += dir.x * 0.5;
                col.position.z += dir.z * 0.5;
            }
            
            if (dx < 1.2 && dz < 1.2) {
                col.collected = true;
                
                switch (col.collectibleType) {
                    case 'coin':
                        this.coins++;
                        this.score += 10 * this.multiplier;
                        this.playSound('coin');
                        this.spawnParticles(col.position.x, col.position.y, col.position.z, 0xFFD700, 5);
                        // Mission
                        this.missions.forEach(m => {
                            if (m.type === 'coins_run') m.progress = this.coins;
                        });
                        break;
                    case 'chest':
                        this.chestsCollected++;
                        this.playSound('chest');
                        this.spawnParticles(col.position.x, col.position.y, col.position.z, 0xFFD700, 15);
                        this.openChest();
                        break;
                    case 'powerup':
                        this.activatePowerup(col.powerupType);
                        break;
                }
                
                this.scene.remove(col);
                this.collectibles.splice(i, 1);
            }
        }
    },
    
    // ============================================================
    // SPAWNING
    // ============================================================
    
    updateSpawning(dt) {
        // Obstacles
        this.obstacleSpawnTimer -= dt;
        if (this.obstacleSpawnTimer <= 0) {
            const types = ['car', 'car', 'car', 'bus', 'auto', 'bike', 'barrier', 'cone', 'gate', 'vendor', 'construction', 'pothole'];
            const type = types[Math.floor(Math.random() * types.length)];
            const lane = Math.floor(Math.random() * 3);
            
            // Don't spawn on top of existing obstacles
            let canSpawn = true;
            this.obstacles.forEach(o => {
                if (o.lane === lane && Math.abs(o.position.z - (-80)) < 8) canSpawn = false;
            });
            
            if (canSpawn) {
                this.createObstacle(type, lane);
                
                // Sometimes spawn in pairs (harder as game progresses)
                if (Math.random() > 0.6 - this.distance * 0.0001) {
                    let otherLane = (lane + (Math.random() > 0.5 ? 1 : 2)) % 3;
                    this.createObstacle(types[Math.floor(Math.random() * types.length)], otherLane);
                }
            }
            
            // Spawn rate increases with distance
            this.obstacleSpawnTimer = Math.max(0.6, 2.5 - this.distance * 0.001);
        }
        
        // Coins
        this.collectibleSpawnTimer -= dt;
        if (this.collectibleSpawnTimer <= 0) {
            const lane = Math.floor(Math.random() * 3);
            const pattern = Math.random();
            
            if (pattern > 0.7) {
                // Line of coins
                for (let j = 0; j < 5; j++) {
                    this.createCoin(lane, -80 - j * 3, 0);
                }
            } else if (pattern > 0.4) {
                // Arc of coins
                for (let j = 0; j < 5; j++) {
                    this.createCoin(lane, -80 - j * 2.5, Math.sin(j / 4 * Math.PI) * 2);
                }
            } else {
                // Scattered coins
                for (let j = 0; j < 3; j++) {
                    this.createCoin(Math.floor(Math.random() * 3), -80 - j * 4, 0);
                }
            }
            
            this.collectibleSpawnTimer = Math.max(1, 3 - this.distance * 0.0005);
        }
        
        // Chests
        this.chestSpawnTimer -= dt;
        if (this.chestSpawnTimer <= 0) {
            this.createChest(Math.floor(Math.random() * 3), -90);
            this.chestSpawnTimer = 15 + Math.random() * 15;
        }
        
        // Power-ups
        this.powerupSpawnTimer -= dt;
        if (this.powerupSpawnTimer <= 0) {
            const types = ['invisibility', 'superjump', 'speed', 'magnet', 'shield'];
            const type = types[Math.floor(Math.random() * types.length)];
            this.createPowerup(type, Math.floor(Math.random() * 3), -85);
            this.powerupSpawnTimer = 20 + Math.random() * 20;
        }
        
        // Road segments
        const lastRoad = this.roadSegments[this.roadSegments.length - 1];
        if (lastRoad && lastRoad.position.z > -60) {
            this.spawnRoadSegment(lastRoad.position.z - 10);
        }
        
        // Buildings
        const lastBuilding = this.buildings[this.buildings.length - 1];
        if (this.buildings.length === 0 || (lastBuilding && lastBuilding.position.z > -60)) {
            this.spawnBuildings(-80 + Math.random() * 10);
        }
    },
    
    // ============================================================
    // DAY/NIGHT & WEATHER
    // ============================================================
    
    updateDayNight(dt) {
        this.dayNightCycle += dt * 0.01; // Full cycle ~100s
        const cyclePos = Math.sin(this.dayNightCycle);
        
        const wasNight = this.isNight;
        this.isNight = cyclePos < -0.2;
        
        if (this.isNight) {
            // Night
            const t = Math.max(0, (-cyclePos - 0.2) / 0.8);
            this.scene.background.setHex(0x0a0a2e);
            this.scene.fog.color.setHex(0x0a0a2e);
            this.ambientLight.intensity = 0.15;
            this.sunLight.intensity = 0.1;
            this.hemiLight.intensity = 0.1;
            this.renderer.toneMappingExposure = 0.6;
            
            // Street lights on
            this.streetLights.forEach(sl => {
                if (sl.streetLight) sl.streetLight.intensity = 2.0;
                if (sl.fixture) {
                    sl.fixture.material.emissiveIntensity = 1.0;
                }
            });
        } else {
            // Day
            this.scene.background.setHex(0x87CEEB);
            this.scene.fog.color.setHex(0x87CEEB);
            this.ambientLight.intensity = 0.5;
            this.sunLight.intensity = 1.0;
            this.hemiLight.intensity = 0.4;
            this.renderer.toneMappingExposure = 1.0;
            
            this.streetLights.forEach(sl => {
                if (sl.streetLight) sl.streetLight.intensity = 0;
                if (sl.fixture) {
                    sl.fixture.material.emissiveIntensity = 0.1;
                }
            });
        }
        
        // Night bonus for Night Runner
        if (this.isNight && this.characters[this.selectedCharacter].id === 'night') {
            this.multiplier = 1.2;
        } else {
            this.multiplier = 1;
        }
    },
    
    // ============================================================
    // MAIN UPDATE
    // ============================================================
    
    update(dt) {
        if (this.state !== 'playing') return;
        
        this.animTime += dt;
        
        // Speed increases over time
        const effectiveSpeed = this.speedBoostActive ? this.speed * 1.8 : this.speed;
        this.speed = Math.min(this.maxSpeed, this.speed + this.speedIncrement * dt * 60);
        
        // Distance and score
        this.distance += effectiveSpeed * dt * 60;
        this.score += Math.floor(effectiveSpeed * dt * 60 * this.multiplier);
        
        // Player lane movement (smooth)
        this.targetLaneX = this.lanes[this.playerLane];
        this.player.position.x += (this.targetLaneX - this.player.position.x) * 0.15;
        
        // Jump physics
        if (this.isJumping) {
            this.playerY += this.jumpVelocity;
            this.jumpVelocity -= 0.015;
            if (this.playerY <= 0) {
                this.playerY = 0;
                this.isJumping = false;
                this.jumpVelocity = 0;
            }
        }
        this.player.position.y = this.playerY;
        
        // Slide
        if (this.isSliding) {
            this.slideTimer -= dt;
            if (this.slideTimer <= 0) {
                this.isSliding = false;
            }
        }
        
        // Player animation
        this.animatePlayer(dt);
        
        // Invincibility timer
        if (this.invincible) {
            this.invincibleTimer -= dt;
            this.player.visible = Math.floor(this.invincibleTimer * 10) % 2 === 0;
            if (this.invincibleTimer <= 0) {
                this.invincible = false;
                this.player.visible = true;
            }
        }
        
        // Invisibility visual
        if (this.invisibleActive) {
            this.player.children.forEach(child => {
                if (child.material) child.material.transparent = true;
                if (child.material) child.material.opacity = 0.3;
            });
        } else {
            this.player.children.forEach(child => {
                if (child.material && child !== this.player.shieldMesh) {
                    child.material.transparent = false;
                    child.material.opacity = 1;
                }
            });
        }
        
        // Power-up timer
        if (this.activePowerup) {
            this.powerupTimer -= dt;
            const fill = (this.powerupTimer / this.powerupDuration) * 100;
            document.getElementById('powerup-fill').style.width = fill + '%';
            
            if (this.powerupTimer <= 0) {
                this.magnetActive = false;
                this.invisibleActive = false;
                this.superJumpActive = false;
                this.speedBoostActive = false;
                this.activePowerup = null;
                document.getElementById('active-powerup').classList.remove('active');
            }
        }
        
        // Move world toward player (endless runner illusion)
        this.obstacles.forEach(o => { o.position.z += effectiveSpeed; });
        this.collectibles.forEach(c => {
            if (!c.collected) c.position.z += effectiveSpeed;
        });
        this.roadSegments.forEach(r => { r.position.z += effectiveSpeed; });
        this.buildings.forEach(b => { b.position.z += effectiveSpeed; });
        this.decorations.forEach(d => { d.position.z += effectiveSpeed; });
        
        // Animate collectibles
        this.collectibles.forEach(c => {
            if (!c.collected) {
                c.rotation.y += dt * 2;
                if (c.sparkle) {
                    c.sparkle.rotation.y += dt * 5;
                    c.sparkle.rotation.x += dt * 3;
                }
            }
        });
        
        // Police chase
        this.updatePolice(dt);
        
        // Cleanup distant objects
        this.cleanupObjects();
        
        // Spawning
        this.updateSpawning(dt);
        
        // Day/night
        this.updateDayNight(dt);
        
        // Particles
        this.updateParticles(dt);
        
        // Collisions
        this.checkCollisions();
        this.checkCollectibles();
        
        // Camera
        this.updateCamera(dt);
        
        // Update HUD
        this.updateHUD();
        
        // Siren sound occasionally
        if (Math.random() < 0.002) this.playSound('siren');
    },
    
    animatePlayer(dt) {
        const runSpeed = 8;
        
        if (this.isSliding) {
            // Slide animation - character leans forward low
            this.player.torso.scale.y = 0.5;
            this.player.torso.position.y = 0.7;
            this.player.head.position.y = 1.4;
            // Flatten beanie too
            this.player.children.forEach(c => {
                if (c !== this.player.torso && c !== this.player.head && 
                    c !== this.player.leftArm && c !== this.player.rightArm &&
                    c !== this.player.leftLeg && c !== this.player.rightLeg &&
                    c !== this.player.shieldMesh) {
                    // Keep attached but scale down
                }
            });
            this.player.leftLeg.rotation.x = -1.2;
            this.player.rightLeg.rotation.x = 0.3;
            this.player.leftArm.rotation.x = -0.5;
            this.player.rightArm.rotation.x = -0.5;
        } else if (this.isJumping) {
            // Jump animation - arms up, legs tucked
            this.player.torso.scale.y = 1;
            this.player.torso.position.y = 1.5;
            this.player.head.position.y = 2.45;
            this.player.leftArm.rotation.x = -2.5;
            this.player.rightArm.rotation.x = -2.5;
            this.player.leftLeg.rotation.x = 0.5;
            this.player.rightLeg.rotation.x = 0.5;
        } else {
            // Running animation
            this.player.torso.scale.y = 1;
            this.player.torso.position.y = 1.5;
            this.player.head.position.y = 2.45;
            const legSwing = Math.sin(this.animTime * runSpeed) * 0.8;
            this.player.leftLeg.rotation.x = legSwing;
            this.player.rightLeg.rotation.x = -legSwing;
            this.player.leftArm.rotation.x = -legSwing * 0.6;
            this.player.rightArm.rotation.x = legSwing * 0.6;
            
            // Head bob
            this.player.head.position.y = 2.45 + Math.abs(Math.sin(this.animTime * runSpeed)) * 0.05;
        }
        
        // Lean into turns
        const turnLean = (this.targetLaneX - this.player.position.x) * 0.1;
        this.player.rotation.z = -turnLean * 0.3;
        this.player.rotation.y = -turnLean * 0.15;
    },
    
    updatePolice(dt) {
        // Police gradually moves to target distance
        this.policeDistance += (this.policeTargetDistance - this.policeDistance) * 0.02;
        
        // Police slowly gains on you over time
        this.policeTargetDistance = Math.max(3, this.policeTargetDistance - dt * 0.02);
        
        // Police position follows player with slight delay
        this.police.position.x += (this.player.position.x - this.police.position.x) * 0.03;
        this.police.position.z = this.policeDistance;
        this.police.position.y = this.playerY * 0.5; // Police doesn't jump as high
        
        // Police running animation
        const pRunSpeed = 7;
        if (this.police.leftLeg) {
            this.police.leftLeg.rotation.x = Math.sin(this.animTime * pRunSpeed) * 0.7;
            this.police.rightLeg.rotation.x = -Math.sin(this.animTime * pRunSpeed) * 0.7;
        }
        if (this.police.leftArm) {
            this.police.leftArm.rotation.x = -Math.sin(this.animTime * pRunSpeed) * 0.5;
            this.police.rightArm.rotation.x = Math.sin(this.animTime * pRunSpeed) * 0.5;
        }
        
        // If police is too close, game over
        if (this.policeDistance <= 2) {
            this.gameOver();
        }
    },
    
    updateCamera(dt) {
        // Camera follows player with smooth lag
        const targetCamX = this.player.position.x * 0.3;
        const targetCamY = 8 + this.playerY * 0.5;
        this.camera.position.x += (targetCamX - this.camera.position.x) * 0.05;
        this.camera.position.y += (targetCamY - this.camera.position.y) * 0.05;
        
        // Look slightly ahead of player
        const lookTarget = new THREE.Vector3(
            this.player.position.x * 0.15,
            1 + this.playerY * 0.3,
            -10
        );
        this.camera.lookAt(lookTarget);
        
        // Speed boost camera effect
        if (this.speedBoostActive) {
            this.camera.fov = 72;
        } else {
            this.camera.fov += (65 - this.camera.fov) * 0.05;
        }
        this.camera.updateProjectionMatrix();
    },
    
    updateParticles(dt) {
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.position.add(p.velocity);
            p.velocity.y -= 0.005;
            p.life -= dt * 2;
            p.scale.setScalar(p.life);
            if (p.life <= 0) {
                this.scene.remove(p);
                this.particles.splice(i, 1);
            }
        }
    },
    
    cleanupObjects() {
        // Remove obstacles that are behind the camera
        for (let i = this.obstacles.length - 1; i >= 0; i--) {
            if (this.obstacles[i].position.z > 20) {
                this.scene.remove(this.obstacles[i]);
                this.obstacles.splice(i, 1);
            }
        }
        // Remove collectibles behind camera
        for (let i = this.collectibles.length - 1; i >= 0; i--) {
            if (this.collectibles[i].position.z > 20) {
                this.scene.remove(this.collectibles[i]);
                this.collectibles.splice(i, 1);
            }
        }
        // Remove road segments behind camera
        for (let i = this.roadSegments.length - 1; i >= 0; i--) {
            if (this.roadSegments[i].position.z > 30) {
                this.scene.remove(this.roadSegments[i]);
                this.roadSegments.splice(i, 1);
            }
        }
        // Remove distant buildings
        for (let i = this.buildings.length - 1; i >= 0; i--) {
            if (this.buildings[i].position.z > 40) {
                this.scene.remove(this.buildings[i]);
                this.buildings.splice(i, 1);
            }
        }
        for (let i = this.decorations.length - 1; i >= 0; i--) {
            if (this.decorations[i].position.z > 40) {
                this.scene.remove(this.decorations[i]);
                this.decorations.splice(i, 1);
            }
        }
    },
    
    updateHUD() {
        document.getElementById('hud-score').textContent = this.score;
        document.getElementById('hud-coins').textContent = this.coins;
        document.getElementById('distance-display').textContent = Math.floor(this.distance) + 'm';
        document.getElementById('hud-multiplier').textContent = 'x' + this.multiplier.toFixed(1);
    },
    
    // ============================================================
    // RENDER LOOP
    // ============================================================
    
    animate() {
        requestAnimationFrame(() => this.animate());
        
        const dt = Math.min(this.clock.getDelta(), 0.05); // Cap delta time
        
        this.update(dt);
        
        // Render
        this.renderer.render(this.scene, this.camera);
    },
};

// ============================================================
// START GAME
// ============================================================
window.addEventListener('load', () => {
    Game.init();
});
</script>
</body>
</html>
